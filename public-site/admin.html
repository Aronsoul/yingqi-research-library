<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料管理 · 知序</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./admin.css"><script src="./admin.js" defer></script></head><body><main class="admin"><a href="./">← 返回资料库</a><h1>资料管理</h1><p>使用 GitHub 授权维护内容，保存后网站自动发布更新。上传文件会写入公开仓库并可由访客下载。</p><p id="message" role="status">正在检查管理配置…</p><div class="actions"><button id="login" class="primary" hidden>登录 GitHub</button><button id="logout" hidden>退出管理</button></div><section id="editor" hidden><div class="actions"><button id="save" class="primary">保存到 GitHub</button><button id="export">导出草稿</button><button id="reload">重新读取</button><a href="https://github.com/Aronsoul/yingqi-research-library/actions" target="_blank" rel="noreferrer">查看发布进度 ↗</a></div><p id="dirty">没有未保存的修改</p><nav id="tabs"><button data-tab="papers">文献</button><button data-tab="categories">文献分类</button><button data-tab="teams">研究团队</button><button data-tab="projects">成果</button><button data-tab="relations">关联连线</button><button data-tab="treeNodes">根节点</button><button data-tab="resources">资料库</button><button data-tab="resourceCategories">资料分类</button></nav><input id="search" placeholder="搜索标题、DOI、文件或分类" aria-label="搜索资料"><button id="add">添加</button><div id="list"></div></section><dialog id="dialog"><form id="form"><h2 id="dialog-title"></h2><div id="fields"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保留修改</button></div></form></dialog></main></body></html>
